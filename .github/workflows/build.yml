name: Build miu-iYellowPage

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "APK=$APK"
          echo
          echo "APK contents:"
          unzip -l "$APK"

          echo
          echo "Xposed entry:"
          unzip -p "$APK" assets/xposed_init | cat -A

          ENTRY=$(unzip -p "$APK" assets/xposed_init | tr -d '\r')

          EXPECTED_ENTRIES=(
            'com.microllate.miuyellowpage.HookEntry'
            'com.microllate.miuyellowpage.OfficialSqliteImportHook'
            'com.microllate.miuyellowpage.ContactsChinaEnvironmentHook'
            'com.microllate.miuyellowpage.SecurityCenterChinaEnvironmentHook'
            'com.microllate.miuyellowpage.YellowPagePrivacyCenterCompatHook'
            'com.microllate.miuyellowpage.RecentTasksClearButtonHook'
            'com.microllate.miuyellowpage.CarWithPrivacyCompatHook'
          )

          for EXPECTED in "${EXPECTED_ENTRIES[@]}"; do
            if ! printf '%s\n' "$ENTRY" | grep -Fxq "$EXPECTED"; then
              echo "ERROR: missing Xposed entry: $EXPECTED"
              echo "Actual xposed_init entries:"
              printf '%s\n' "$ENTRY"
              exit 1
            fi
          done

          if printf '%s\n' "$ENTRY" | grep -Fxq 'com.microllate.miuyellowpage.YellowPageHook'; then
            echo "ERROR: legacy YellowPageHook entry found"
            exit 1
          fi

          echo
          echo "DEX files:"
          unzip -Z1 "$APK" 'classes*.dex'
