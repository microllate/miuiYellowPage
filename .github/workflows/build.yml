name: Build miu-iYellowPage

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "APK=$APK"
          echo
          echo "APK contents:"
          unzip -l "$APK"

          echo
          echo "Xposed entry:"
          unzip -p "$APK" assets/xposed_init | cat -A

          # Multiple IXposedHookLoadPackage classes are valid: Xposed/LSPosed
          # loads each non-empty line from assets/xposed_init.
          ENTRY=$(unzip -p "$APK" assets/xposed_init | tr -d '\r')

          EXPECTED_ENTRIES=(
            'com.microllate.miuyellowpage.HookEntry'
            'com.microllate.miuyellowpage.OfficialSqliteImportHook'
            'com.microllate.miuyellowpage.ContactsChinaEnvironmentHook'
            'com.microllate.miuyellowpage.SecurityCenterChinaEnvironmentHook'
            'com.microllate.miuyellowpage.YellowPagePrivacyCenterCompatHook'
          )

          for EXPECTED in "${EXPECTED_ENTRIES[@]}"; do
            printf '%s\n' "$ENTRY" | grep -Fxq "$EXPECTED"
          done

          if printf '%s\n' "$ENTRY" | grep -Fq 'YellowPageHook'; then
            echo "ERROR: legacy YellowPageHook entry found"
            exit 1
          fi

          echo
          echo "DEX files:"
          unzip -Z1 "$APK" 'classes*.dex'

          echo
          echo "Relevant DEX strings:"
          for DEX in $(unzip -Z1 "$APK" 'classes*.dex'); do
            echo "--- $DEX ---"
            unzip -p "$APK" "$DEX" | strings | grep -E 'HookEntry|OfficialSqliteImportHook|ContactsChinaEnvironmentHook|SecurityCenterChinaEnvironmentHook|YellowPagePrivacyCenterCompatHook|YellowPageHook|miu-iYellowPage' || true
          done

          FOUND_HOOK=0
          FOUND_IMPORT=0
          FOUND_CONTACTS=0
          FOUND_SECURITYCENTER=0
          FOUND_PRIVACY=0
          FOUND_LEGACY=0

          while IFS= read -r DEX; do
            STRINGS=$(unzip -p "$APK" "$DEX" | strings || true)
            printf '%s\n' "$STRINGS" | grep -Fq 'HookEntry' && FOUND_HOOK=1 || true
            printf '%s\n' "$STRINGS" | grep -Fq 'OfficialSqliteImportHook' && FOUND_IMPORT=1 || true
            printf '%s\n' "$STRINGS" | grep -Fq 'ContactsChinaEnvironmentHook' && FOUND_CONTACTS=1 || true
            printf '%s\n' "$STRINGS" | grep -Fq 'SecurityCenterChinaEnvironmentHook' && FOUND_SECURITYCENTER=1 || true
            printf '%s\n' "$STRINGS" | grep -Fq 'YellowPagePrivacyCenterCompatHook' && FOUND_PRIVACY=1 || true
            printf '%s\n' "$STRINGS" | grep -Fq 'YellowPageHook' && FOUND_LEGACY=1 || true
          done < <(unzip -Z1 "$APK" 'classes*.dex')

          test "$FOUND_HOOK" -eq 1
          test "$FOUND_IMPORT" -eq 1
          test "$FOUND_CONTACTS" -eq 1
          test "$FOUND_SECURITYCENTER" -eq 1
          test "$FOUND_PRIVACY" -eq 1
          test "$FOUND_LEGACY" -eq 0

          echo
          echo "APK verification passed"

      - name: Publish build failure to GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "## Build failure"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo
            echo "### Build log"
            if [ -f build.log ]; then
              tail -n 250 build.log
            else
              echo "build.log was not created"
            fi
          } > failure.md
          gh issue create --title "CI build failure: ${GITHUB_SHA::7}" --body-file failure.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miu-iYellowPage-build-logs
          path: |
            build.log
            failure.md
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miu-iYellowPage-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
